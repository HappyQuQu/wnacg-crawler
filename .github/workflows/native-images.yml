name: Native image verification

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/wnacg-crawler

jobs:
  image:
    name: Verify native ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        if: inputs.publish
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build native image once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: ${{ !inputs.publish }}
          tags: ${{ !inputs.publish && 'wnacg-smoke:ci' || '' }}
          outputs: ${{ inputs.publish && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=wnacg-${{ matrix.arch }}
          cache-to: type=gha,scope=wnacg-${{ matrix.arch }},mode=max
          sbom: ${{ inputs.publish }}
          provenance: ${{ inputs.publish }}
      - name: Verify exact image
        env:
          PUBLISH: ${{ inputs.publish }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          image=wnacg-smoke:ci
          if [[ "${PUBLISH}" == true ]]; then
            image="${IMAGE}@${DIGEST}"
            docker pull "${image}"
          fi
          test "$(docker image inspect "${image}" --format '{{.Architecture}}')" = "${ARCH}"
          bash scripts/smoke-container.sh "${image}"
      - name: Record verified digest
        if: inputs.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: verified-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

