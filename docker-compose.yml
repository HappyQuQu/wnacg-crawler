services:
  wnacg:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    shm_size: "2gb"
    environment:
      - PYTHONUNBUFFERED=1
      - FETCH_MODE=auto
      - ENABLE_BROWSER=true
      - ENABLE_STEALTH=false
      - BROWSER_HEADLESS=true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
