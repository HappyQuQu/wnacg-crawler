<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WNACG Downloader 设置</title>
  </head>
  <body>
    <main style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:640px;margin:40px auto;display:grid;gap:16px">
      <h1>WNACG Downloader 扩展设置</h1>
      <label>
        后台地址
        <input id="server-url" style="width:100%;height:36px" value="http://127.0.0.1:8080">
      </label>
      <label>
        后台页面地址
        <input id="admin-url" style="width:100%;height:36px" value="http://127.0.0.1:5173">
      </label>
      <label>
        Extension Token
        <input id="token" style="width:100%;height:36px" placeholder="可选">
      </label>
      <button id="save" style="height:38px">保存</button>
      <p id="message"></p>
    </main>
    <script type="module" src="dist/options.js"></script>
  </body>
</html>
