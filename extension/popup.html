<!doctype html>
<html lang="zh-CN" class="popup-document"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WNACG 下载器</title><link rel="icon" type="image/svg+xml" href="icons/icon.svg"><link rel="stylesheet" href="ui.css"></head><body>
<main id="popup">
  <header class="app-header"><div class="brand"><span class="brand-mark"><img src="icons/icon.svg" alt="" width="32" height="32"></span><div class="brand-copy"><h1>WNACG 下载器</h1><p id="server-url">正在检测后台…</p></div></div><span class="badge connection-badge badge-orange" id="status-badge" role="status">连接中</span></header>
  <p class="connection-notice dashboard-section" id="connection-notice" role="alert" hidden></p>
  <section class="stats-row dashboard-section" aria-label="下载概览"><div class="stat-item"><span class="stat-label">资料库记录<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14m0-14C9 4 4 4 2 5v14c4-1 7-1 10 2 3-3 6-3 10-2V5c-2-1-7-1-10 2Z"/></svg></span><strong class="stat-num" id="stat-library">—</strong></div><div class="stat-item active"><span class="stat-label">下载中<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5l3-9 4 18 3-9h5"/></svg></span><strong class="stat-num" id="stat-active">—</strong></div><div class="stat-item"><span class="stat-label">已下载<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></span><strong class="stat-num" id="stat-completed">—</strong></div></section>
  <section class="card page-card dashboard-section" id="page-card" aria-label="当前作品"><div class="card-header"><div class="section-heading"><span class="section-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg></span><div><span class="eyebrow">原站入口</span><h2 class="card-title">当前作品</h2></div></div><span class="badge badge-orange" id="page-state">识别中</span></div><div class="page-body"><p id="page-title">正在识别当前页面…</p><div class="page-actions"><p id="page-meta"></p><button class="btn-primary" type="button" id="submit" disabled>加入队列</button></div><p id="page-feedback" role="status"></p></div></section>
  <section class="card task-panel dashboard-section" aria-labelledby="tasks-heading"><div class="card-header"><div><span class="eyebrow">当前队列</span><div class="task-heading-line"><h2 class="card-title" id="tasks-heading">任务进度</h2><span id="task-count"></span></div><p id="queue-breakdown">正在读取后台任务…</p></div><button class="icon-button" id="refresh-btn" type="button" aria-label="刷新状态" title="刷新状态"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 11.5-1L20 9M4 15l2.5 3A7 7 0 0 0 18 17"/></svg></button></div><div class="task-tabs" role="tablist" aria-label="扩展任务筛选"><button type="button" id="tab-active" role="tab" aria-selected="true" aria-controls="task-list" data-view="active">进行中<span class="tab-count" id="active-count">—</span></button><button type="button" id="tab-attention" role="tab" aria-selected="false" aria-controls="task-list" tabindex="-1" data-view="attention">需处理<span class="tab-count" id="attention-count">—</span></button></div><div class="task-list" id="task-list" tabindex="0" role="tabpanel" aria-labelledby="tab-active" aria-label="下载任务" aria-busy="true"><p class="empty-text">正在获取下载任务…</p></div></section>
  <section class="card" id="settings-panel" aria-labelledby="settings-heading"><div class="connection-editor" id="connection-editor">
  <div class="editor-header"><span class="eyebrow">扩展偏好</span><h2 class="card-title" id="settings-heading">连接设置</h2><p class="card-sub">填写本地后台地址与后台设置页中的 Token。</p></div>
  <fieldset class="editor-fields" id="editor-fields" disabled>
    <div class="field"><label class="field-label" for="input-server">后台服务地址</label><input class="field-input" id="input-server" type="url" spellcheck="false" autocomplete="off" aria-describedby="server-hint input-server-error"><p class="field-hint" id="server-hint">例如 http://192.168.2.222:8089，不含 /api。首次测试或保存时，请允许访问该后台地址。</p><p class="field-error" id="input-server-error" hidden></p></div>
    <div class="field"><label class="field-label" for="input-admin">后台页面地址</label><input class="field-input" id="input-admin" type="url" spellcheck="false" autocomplete="off" aria-describedby="admin-hint input-admin-error"><p class="field-hint" id="admin-hint">一体化部署与服务地址相同，开发环境可填 5173 端口。</p><p class="field-error" id="input-admin-error" hidden></p></div>
    <div class="field"><div class="field-heading"><label for="input-token">扩展 Token</label><span class="badge badge-blue" id="token-state">读取中</span></div><div class="field-row"><input class="field-input" id="input-token" type="password" aria-describedby="input-token-error" autocomplete="off" spellcheck="false" maxlength="256" placeholder="粘贴后台生成的 Token"><button class="icon-button" type="button" id="btn-visibility" aria-label="显示 Token" title="显示 Token" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><p class="field-error" id="input-token-error" hidden>Token 长度不能超过 256 个字符。</p><div class="token-actions"><button type="button" class="text-button primary" id="btn-paste">粘贴 Token</button><button type="button" class="text-button" id="btn-clear">清除 Token</button></div></div>
  </fieldset>
  <div class="editor-actions"><div class="editor-actions-row"><span class="editor-status" id="editor-status" role="status">正在读取设置…</span><button type="button" class="text-button" id="btn-discard" disabled>撤销更改</button></div><div class="editor-actions-row"><button type="button" class="btn-secondary" id="btn-test" disabled>测试连接</button><button type="button" class="btn-primary" id="btn-save" disabled>保存设置</button></div><p class="msg" id="settings-msg" role="status"></p></div>
</div></section>
  <footer class="footer"><button class="text-button" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 3-1 3-3 1-3 3 2 2v3l-1 2 3 3 3-1 2 2 3-1 2-2 3-2-1-3 2-2-2-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg><span id="settings-label">连接设置</span></button><button class="text-button primary" id="open-admin" type="button">打开后台<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6m0-6L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></button></footer>
</main><script type="module" src="dist/popup.js"></script></body></html>
