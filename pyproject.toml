[project]
name = "wnacg-downloader"
version = "2.0.0.dev0"
description = "Local downloader hub with web admin and browser extension."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "curl-cffi>=0.15",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pillow>=11.3",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "greenlet>=3.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "tenacity>=8.0",
  "loguru>=0.7",
  "alembic>=1.13",
  "playwright>=1.44,<1.50",
  "playwright-stealth>=2.0,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = []
strict = false
warn_unused_ignores = true
warn_redundant_casts = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["old*", "docs*", "frontend*", "extension*", "config*", "data*", "logs*"]
